server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: aiops-platform
  datasource:
    url: jdbc:mysql://localhost:3306/aiops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PWD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.aiops: DEBUG
  file:
    name: logs/aiops-platform.log

aiops:
  security:
    jwt-secret: ${JWT_SECRET:aiops-platform-dev-secret-key-change-me-in-prod-2027-thesis-0123456789-abcdef}
    aes-key: ${AES_KEY:16bytes-1234abcd}
    jwt-expire-hours: 12
  drain:
    depth: 4
    sim-threshold: 0.5
    max-children: 100
  metric:
    retention-days: 30
  log:
    window-minutes: 60
    max-pull-per-window: 50000
  logstash:
    enabled: false   # 本机 Logstash 就绪后置 true
    destination: 127.0.0.1:5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
