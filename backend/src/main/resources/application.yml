server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: aiops-platform
  datasource:
    url: jdbc:mysql://localhost:3306/aiops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PWD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.aiops: DEBUG
  file:
    name: logs/aiops-platform.log

aiops:
  security:
    jwt-secret: ${JWT_SECRET:aiops-platform-dev-secret-key-change-me-in-prod-2027-thesis-0123456789-abcdef}
    aes-key: ${AES_KEY:16bytes-1234abcd}
    jwt-expire-hours: 12
  # Drain 日志模板提取算法默认参数（§7.2 论文核心算法 §7.2）。
  # 任何参数变更都会触发该 (datasourceId, indexConfigId) 解析器的重建（见 DrainService.updateParams）。
  drain:
    # 前缀树最大深度。第 1 层 length（token 数），第 2 层 firstToken（可能 <*> 桶），
    # 第 3 ~ depth 层按 token 进入子节点。>=3，经典默认 4。
    depth: 4
    # 模板相似度阈值 simTh，(0,1)。SeqDist = 同位置相同 token 数 / max(len1,len2)，
    # 模板中的 <*> 不计入分母；>= simTh 视为同一模板。
    sim-th: 0.4
    # 每个内部节点的最大子节点数，超过则归入 <*> 桶，防止高基数 token 打爆树
    max-children: 100
    # 单解析器允许的最大 cluster 数；超出后整树清空（简化版 LRU 兜底）
    max-cluster: 1000
    # 空白之外的额外分隔符。出现于整行均被替换为空格后再分词
    extra-delimiters: ",=|:()[]{}\"'"
  metric:
    retention-days: 30
  log:
    window-minutes: 60
    max-pull-per-window: 50000
  logstash:
    enabled: false   # 本机 Logstash 就绪后置 true
    destination: 127.0.0.1:5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
